<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Wiki 知識庫簡報總覽 - 京都抹茶和紙手帳風</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-washi: #F9F6F0;
      --card-cream: #FFFFFF;
      --border-linen: #E6DFD3;
      --matcha-main: #8FA893;
      --matcha-dark: #5F7A63;
      --matcha-soft: #F0F4F1;
      --terracotta-accent: #D99B84;
      --terracotta-dark: #B5735B;
      --terracotta-soft: #FBF2EE;
      --text-coffee: #4A443F;
      --text-muted: #7A726B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-washi);
      background-image: radial-gradient(#DED7C8 0.8px, transparent 0.8px);
      background-size: 20px 20px;
      color: var(--text-coffee);
      font-family: 'Noto Sans TC', sans-serif;
      min-height: 100vh;
      padding: 48px 24px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1040px;
    }

    /* 頂部手帳封面區 */
    header.notebook-header {
      background: var(--card-cream);
      border: 1.5px solid var(--border-linen);
      border-radius: 24px;
      padding: 40px 44px 34px;
      box-shadow: 0 10px 28px rgba(74, 68, 63, 0.05);
      position: relative;
      text-align: center;
      margin-bottom: 32px;
    }

    .washi-tape {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%) rotate(-1.2deg);
      width: 160px;
      height: 28px;
      background-color: rgba(143, 168, 147, 0.5);
      border-left: 2px dashed rgba(255,255,255,0.65);
      border-right: 2px dashed rgba(255,255,255,0.65);
      backdrop-filter: blur(2px);
    }

    .tag-pill {
      display: inline-block;
      background: var(--terracotta-soft);
      color: var(--terracotta-dark);
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 16px;
      border-radius: 999px;
      margin-bottom: 12px;
      border: 1px solid rgba(217, 155, 132, 0.35);
    }

    h1 {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 2rem;
      color: var(--text-coffee);
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.98rem;
      max-width: 620px;
      margin: 0 auto 24px;
      line-height: 1.6;
    }

    /* 搜尋與標籤篩選列 */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
    }

    .search-box {
      position: relative;
      width: 100%;
      max-width: 340px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 18px 10px 38px;
      border-radius: 999px;
      border: 1.5px solid var(--border-linen);
      background: var(--bg-washi);
      color: var(--text-coffee);
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-box input:focus {
      border-color: var(--matcha-main);
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(143, 168, 147, 0.18);
    }

    .search-box::before {
      content: "🔍";
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.85rem;
      opacity: 0.7;
    }

    .filter-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .filter-btn {
      background: var(--bg-washi);
      border: 1px solid var(--border-linen);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.84rem;
      cursor: pointer;
      font-family: 'Zen Maru Gothic', sans-serif;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--matcha-main);
      color: #FFFFFF;
      border-color: var(--matcha-main);
    }

    /* 統計資訊列 */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding: 0 6px;
      font-size: 0.88rem;
      color: var(--text-muted);
      font-family: 'Zen Maru Gothic', sans-serif;
    }

    /* 簡報卡片網格 */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 24px;
    }

    .deck-card {
      background: var(--card-cream);
      border: 1.5px solid var(--border-linen);
      border-radius: 20px;
      padding: 28px 26px 22px;
      box-shadow: 0 8px 22px rgba(74, 68, 63, 0.04);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
    }

    .deck-card:hover {
      transform: translateY(-4px);
      border-color: var(--matcha-main);
      box-shadow: 0 14px 30px rgba(143, 168, 147, 0.16);
    }

    .card-tape {
      position: absolute;
      top: -10px;
      left: 26px;
      width: 72px;
      height: 20px;
      background-color: rgba(217, 155, 132, 0.45);
      transform: rotate(-2deg);
      border-left: 1.5px dashed rgba(255,255,255,0.6);
      border-right: 1.5px dashed rgba(255,255,255,0.6);
    }

    .deck-card:nth-child(even) .card-tape {
      background-color: rgba(143, 168, 147, 0.45);
      transform: rotate(1.8deg);
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .card-date {
      background: var(--bg-washi);
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-linen);
    }

    .card-title {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 1.22rem;
      color: var(--text-coffee);
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 16px;
      flex: 1;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .mini-tag {
      font-size: 0.75rem;
      background: var(--matcha-soft);
      color: var(--matcha-dark);
      padding: 2px 10px;
      border-radius: 999px;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      padding-top: 14px;
      border-top: 1px dashed var(--border-linen);
    }

    .btn-primary {
      flex: 1;
      text-align: center;
      background: var(--matcha-main);
      color: #FFFFFF;
      text-decoration: none;
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 999px;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: var(--matcha-dark);
    }

    .btn-secondary {
      text-align: center;
      background: var(--bg-washi);
      color: var(--text-coffee);
      border: 1px solid var(--border-linen);
      text-decoration: none;
      font-size: 0.82rem;
      padding: 8px 12px;
      border-radius: 999px;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      background: var(--terracotta-soft);
      border-color: var(--terracotta-accent);
      color: var(--terracotta-dark);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 20px;
      background: var(--card-cream);
      border: 1.5px dashed var(--border-linen);
      border-radius: 20px;
      color: var(--text-muted);
    }

    footer {
      margin-top: 48px;
      font-size: 0.82rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="notebook-header">
      <div class="washi-tape"></div>
      <span class="tag-pill">🍵 LLM Wiki 知識庫與簡報索引</span>
      <h1>研究筆記與 HTML 簡報總覽</h1>
      <p class="subtitle">
        收錄所有基於本地 <code>/wiki/</code> 嚴格彙整之研究簡報。支援關鍵字搜尋、主題篩選，並可直接開啟單頁簡報或檢視對應的 Markdown 原始筆記。
      </p>

      <div class="toolbar">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="搜尋簡報標題、摘要或標籤...">
        </div>
        <div class="filter-tags" id="filterContainer">
          <button class="filter-btn active" data-tag="ALL">全部主題</button>
        </div>
      </div>
    </header>

    <div class="stats-bar">
      <span id="deckCount">共收錄 0 份簡報</span>
      <span>目錄規範：<code>/presentations/YYYYMMDD_主題名稱.html</code></span>
    </div>

    <main class="cards-grid" id="cardsGrid"></main>

    <footer>
      🌿 Kyoto Matcha & Washi Theme · 每次新增簡報時只需更新 <code>PRESENTATIONS</code> 清單即可自動呈現
    </footer>
  </div>

  <script>
    // =========================================================================
    // 📌 簡報資料庫設定區（每次在 /presentations/ 新增簡報時，於此陣列新增一筆物件）
    // =========================================================================
    const PRESENTATIONS = [
      {
        date: "2026-11-16",
        title: "LLM 輔助演化與強化學習優化",
        summary: "探討大語言模型作為語義變異算子（Outer Loop）與群組相對策略優化 GRPO（Inner Loop）之雙引擎協同框架與數學推導。",
        tags: ["LLM", "演化演算法", "強化學習", "GRPO"],
        slideUrl: "./presentations/20261116_LLM輔助演化與強化學習優化.html",
        noteUrl: "./notes/20261116_LLM輔助演化與強化學習優化_note.md",
        wikiSource: "[[Wiki_LLM_Evolution_RL]]"
      },
      {
        date: "2026-11-16",
        title: "注意力機制與縮放點積推導（範例模板）",
        summary: "基於本地 Wiki 知識庫整理之 Scaled Dot-Product Attention 核心公式推導與 Softmax 梯度穩定性分析。",
        tags: ["Transformer", "注意力機制", "基礎理論"],
        slideUrl: "./presentations/preview_matcha.html",
        noteUrl: "./notes/20261116_Attention公式推導_note.md",
        wikiSource: "[[Wiki_Attention公式推導]]"
      }
    ];

    // =========================================================================
    // 以下為自動渲染與搜尋篩選邏輯（無需手動修改）
    // =========================================================================
    const cardsGrid = document.getElementById('cardsGrid');
    const searchInput = document.getElementById('searchInput');
    const filterContainer = document.getElementById('filterContainer');
    const deckCount = document.getElementById('deckCount');

    let currentTag = 'ALL';
    let searchQuery = '';

    // 自動收集所有不重複標籤並建立篩選按鈕
    function initTagFilters() {
      const allTags = new Set();
      PRESENTATIONS.forEach(item => item.tags.forEach(t => allTags.add(t)));
      allTags.forEach(tag => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.dataset.tag = tag;
        btn.textContent = `# ${tag}`;
        btn.onclick = () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentTag = tag;
          renderCards();
        };
        filterContainer.appendChild(btn);
      });

      filterContainer.querySelector('[data-tag="ALL"]').onclick = (e) => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentTag = 'ALL';
        renderCards();
      };
    }

    function renderCards() {
      const filtered = PRESENTATIONS.filter(item => {
        const matchTag = currentTag === 'ALL' || item.tags.includes(currentTag);
        const q = searchQuery.toLowerCase();
        const matchQuery = !q ||
          item.title.toLowerCase().includes(q) ||
          item.summary.toLowerCase().includes(q) ||
          item.tags.some(t => t.toLowerCase().includes(q));
        return matchTag && matchQuery;
      });

      deckCount.textContent = `顯示 ${filtered.length} / ${PRESENTATIONS.length} 份簡報`;
      cardsGrid.innerHTML = '';

      if (filtered.length === 0) {
        cardsGrid.innerHTML = `
          <div class="empty-state">
            🍵 找不到符合條件的簡報筆記，試試看切換標籤或清除搜尋關鍵字吧！
          </div>
        `;
        return;
      }

      filtered.forEach(item => {
        const tagsHtml = item.tags.map(t => `<span class="mini-tag"># ${t}</span>`).join('');
        const noteBtnHtml = item.noteUrl
          ? `<a class="btn-secondary" href="${item.noteUrl}" target="_blank" title="檢視對應 Markdown 筆記">📝 筆記</a>`
          : '';

        const card = document.createElement('article');
        card.className = 'deck-card';
        card.innerHTML = `
          <div class="card-tape"></div>
          <div>
            <div class="card-meta">
              <span class="card-date">📅 ${item.date}</span>
              <span>📎 ${item.wikiSource || 'Wiki'}</span>
            </div>
            <h2 class="card-title">${item.title}</h2>
            <p class="card-desc">${item.summary}</p>
          </div>
          <div>
            <div class="card-tags">${tagsHtml}</div>
            <div class="card-actions">
              <a class="btn-primary" href="${item.slideUrl}" target="_blank">▶ 開啟簡報</a>
              ${noteBtnHtml}
            </div>
          </div>
        `;
        cardsGrid.appendChild(card);
      });
    }

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderCards();
    });

    initTagFilters();
    renderCards();
  </script>
</body>
</html>
